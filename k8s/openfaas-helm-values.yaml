# Configuration values for OpenFaaS Helm chart
gateway:
  replicas: 2
  httpPort: 8080
  functionsProviderUrl: http://faas-netes.openfaas.svc.cluster.local:8081
  annotations:
    prometheus.io.scrape: "true"
    prometheus.io.port: "8080"
  cors:
    enabled: true
    origin: "*"
    methods: "GET, POST, PUT, DELETE, OPTIONS"
    headers: "*"
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 6
basic_auth:
  enabled: true
  read_timeout: 5m
  write_timeout: 5m
  secret: basic-auth
faasnetes:
  imagePullPolicy: IfNotPresent
  namespace: openfaas-fn
serviceType: ClusterIP
prometheus:
  enabled: true
  namespace: monitoring
