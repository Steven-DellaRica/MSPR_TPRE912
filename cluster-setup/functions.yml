version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

functions:
  generate-2fa:
    lang: python3-http
    handler: ../functions/generate-2fa 
    image: lingatsu/generate-2fa:latest

  generate-password:
    lang: python3-http
    handler: ../functions/generate-password
    image: lingatsu/generate-password:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: openfaas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password    

  authenticate:
    lang: python3-http
    handler: ../functions/authenticate
    image: lingatsu/authenticate:latest
